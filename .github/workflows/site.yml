# validate -> build the static site -> push branch "site" -> verify that the VM
# (linux-site-sync.timer, every 5 min) serves this build and it renders in Chrome.
# No secrets: the site is static and the VM pulls it.
name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Course data is valid (every command has a recorded output)
        run: scripts/validate.py
      - name: Every module parses
        run: for f in site/js/*.js; do node --check "$f"; done
      - name: Browser tests (light and dark, desktop and phone)
        run: |
          npm install --no-save playwright-core@1.56.1
          npx playwright-core install --with-deps chromium
          python3 tests/serve.py 8123 & sleep 1
          CHROME=$(node -e "console.log(require('playwright-core').chromium.executablePath())") node tests/e2e.mjs http://127.0.0.1:8123/linux/

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write                # push branch "site" only
    outputs:
      commit: ${{ steps.sha.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: sha
        run: echo "commit=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build site
        run: scripts/build-site.sh _site "${{ steps.sha.outputs.commit }}"
      - name: "Publish to branch site (one commit, force-pushed, so no history bloat)"
        run: |
          cd _site
          git init -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "site built from ${{ steps.sha.outputs.commit }}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site

  verify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wait until the VM serves this build
        run: scripts/wait-site.sh "https://apps.badita.com/linux/version.json" "${{ needs.build.outputs.commit }}"
      - name: Browser check on the live page
        run: scripts/e2e-site.sh "https://apps.badita.com/linux/"
