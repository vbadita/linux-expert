# /etc/nginx/apps.badita.com.d/linux.conf  (inside the apps.badita.com server {})
# Static site: /srv/linux-expert/linux is a symlink to the live release (linux-site-sync).
# The whole course runs in the browser; no code runs here per visitor.

location = /linux { return 301 /linux/; }

location = /linux/ {
    root /srv/linux-expert;
    try_files /linux/index.html =404;
    charset utf-8;
    include /etc/nginx/apps.badita.com.d/linux-headers.inc;
    # no-cache: revalidate (ETag) so a deploy shows at once; no-transform keeps
    # Cloudflare from injecting scripts (the CSP would block them anyway).
    add_header Cache-Control "no-cache, no-transform" always;
}

location /linux/ {
    root /srv/linux-expert;
    try_files $uri =404;                    # only files that exist; no directory listing
    charset utf-8;
    charset_types text/css application/javascript image/svg+xml text/plain application/json;
    types {
        text/html                html;
        text/css                 css;
        application/javascript   js mjs;
        image/svg+xml            svg;
        application/json         json;
        text/plain               txt;
    }
    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain application/json;
    include /etc/nginx/apps.badita.com.d/linux-headers.inc;
    add_header Cache-Control "no-cache, no-transform" always;
}
